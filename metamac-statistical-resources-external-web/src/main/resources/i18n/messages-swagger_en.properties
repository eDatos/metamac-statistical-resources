api.doc.swagger.paths.v1.0.datasets.agencyID.resourceID.version.get.parameters.dim.description=<b>DEPRECATED Use representations instead.</b> It allows you to filter the data returned in the response. To do this, it will suffice to specify the dimensions to be filtered and the values to be obtained for each of them. For dimensions that do not specify any filter, all existing values will be returned. Additionally, temporary dimensions allow the use of the modifiers ~last, ~after and ~range. \\nExamples: \\n\\n- dim=TIME_PERIOD:2009|2010\\n\\n- dim=TIME_PERIOD:2009|2010:INDICADORES:VACANCY_OCUPATION_INDEX \\n\\n- ~last=n will return the last n values of the temporary dimension. Usage example: dim=TIME_PERIOD:~last=2 \\n\\n- ~after=DATE will return dates after DATE, including itself. Usage example: dim=TIME_PERIOD:~after=2012-M02 \\n\\n- ~range=DATE1;DATE2 will return dates between DATE1 and DATE2, including themselves. Usage example: dim=TIME_PERIOD:~range=2012;2013
api.doc.swagger.paths.v1.0.datasets.agencyID.resourceID.version.get.parameters.fields.description=It allows you to customize the response by excluding or including fields from it. Possible values are: '-metadata', '-data',  '+keywords', '+dimension.description' and '+constraints'.\\nExamples: \\n\\n- fields=-metadata\\n\\n- fields=-metadata,-data \\n\\n- fields=-data,+dimension.description\\n- fields=+keywords\\n- fields=+constraints (datasets limitations)
api.doc.swagger.paths.v1.0.datasets.agencyID.resourceID.version.get.parameters.lang.description=Languages in which you want to get the response. The specified languages will always include the default language in the organization. Also, if no language is specified, the response will be returned in all available languages. \\nExamples: \\n\\n- lang=es,en,ca\\n\\n- lang=pt
api.doc.swagger.paths.v1.0.datasets.agencyID.resourceID.version.get.parameters.representation.description=It allows you to filter the data obtained in the response. To do this, it will be enough to specify the dimensions that you want to filter and the values to obtain for each of them. For dimensions in which no filter is specified, all existing values will be obtained. Additionally, temporary dimensions allow the use of the ~last, ~after, and ~range modifiers. \\nExamples: \\n\\n- representation=TIME_PERIOD[2009|2010]\\n\\n- representation=TIME_PERIOD[2009|2010]:INDICATORS[VACANCY_OCUPATION_INDEX] \\n\\n- ~last=n return the last n values of the temporary dimension. Usage example: representation=TIME_PERIOD[~last=2] \\n\\n- ~after=DATE return the dates after DATE, including itself. Usage example: representation=TIME_PERIOD[~after=2012-M02] \\n\\n- ~range=DATE1;DATE2 will return the dates between DATE1 and DATE2, both included. Usage example: representation=TIME_PERIOD[~range=2012;2013]
api.doc.swagger.paths.v1.0.datasets.agencyID.resourceID.version.get.parameters.granularity.description   = Allows you to filter observations using their granularities. <br> Example: granularity=GEOGRAPHIC_DIMENSION_ID[MUNICIPALITIES|PROVINCES],TIME_PERIOD[MONTHLY].
