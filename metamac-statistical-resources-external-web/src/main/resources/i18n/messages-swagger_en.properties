api.doc.swagger.paths.v1.0.queries.agencyID.get.parameters.fields.description=It allows you to customize the response by excluding or including fields from it. Possible values are: '+statisticalOperation'.\\nExamples: \\n\\n- fields=+statisticalOperation\\n
api.doc.swagger.paths.v1.0.queries.agencyID.get.parameters.lang.description=Languages in which you want to get the response. The specified languages will always include the default language in the organization. Also, if no language is specified, the response will be returned in all available languages. \\nExamples: \\n\\n- lang=es,en,ca\\n\\n- lang=pt
