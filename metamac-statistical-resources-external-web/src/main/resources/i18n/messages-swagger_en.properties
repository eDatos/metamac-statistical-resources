api.doc.swagger.paths.v1.0.multidatasets.get.parameters.query.description=It allows you to perform a search on the results. \\n\\n The metadata that can be searched are: ID, NAME, DESCRIPTION, TITLE_ALTERNATIVE, KEYWORD, NEWNESS_UNTIL_DATE, VALID_FROM, VALID_TO and STATISTICAL_OPERATION_URN.\\n\\n The logical operators that can be used are: AND and OR.  \\n\\n The comparison operators that can be used are: EQ, IEQ, LIKE, ILIKE, NE, LT, LE, GT, GE, IS_NULL, IS_NOT_NULL and IN
