api.doc.swagger.paths.v1.0.queries.get.parameters.orderBy.description                                     = Permet ordenar la llista de resultats segons una determinada metadada. L'ordre s'especifica mitjan\u00E7ant una metadada i el sentit de l'ordre (operador) que se li vol aplicar.\\n\\n Els possibles operadors s\u00F3n ASC i DESC.\\n\\n Les metadades que es poden usar s\u00F3n ID, NAME. \\nEjemplos:\\n\\n- ID ASC\\n\\n- ID DESC \\n\\n- NAME ASC\\n\\n- NAME DESC
api.doc.swagger.paths.v1.0.queries.get.parameters.query.description                                       = Permet realitzar una cerca sobre els resultats. \\n\\n Les metadades sobre els quals es pot buscar s\u00F3n: ID, NAME, DESCRIPTION, RELATED_DATASET_URN, TYPE, ESTATUS, VALID_FROM, VALID_TO i STATISTICAL_OPERATION_URN.\\n\\n Els operadors l\u00F2gics que es permet usar s\u00F3n: AND i OR. \\n\\n Els operadors de comparaci\u00F3 que es permet usar s\u00F3n: EQ, IEQ, LIKE, ILIKE, NE, LT, LE, GT, GE, IS_NULL, IS_NOT_NULL i IN
