api.doc.swagger.paths.v1.0.datasets.agencyID.resourceID.version.get.parameters.dim.description            = <b>DEPRECADO use representations en el seu lloc.</b> Permet filtrar les dades que s'obtenen en la resposta. Per a aix\u00F2, bastar\u00E0 amb especificar les dimensions que es volen filtrar i els valors a obtenir per a cadascuna d'elles. De les dimensions que no s'especifiqui cap filtre s'obtindran tots els valors existents. De manera addicional, les dimensions temporals permeten l'\u00FAs dels modificadors ~last, ~after i ~range. \\nExemples: \\n\\n- dim=TIME_PERIOD:2009|2010\\n\\n- dim=TIME_PERIOD:2009|2010:INDICADORS:INDEXI_OCUPACION_PLACES \\n\\n- ~last=n retornar\u00E0 els \u00FAltims n valoris de la dimensi\u00F3 temporal. Exemple d'\u00FAs: dim=TIME_PERIOD:~last=2 \\n\\n- ~after=DATA retornar\u00E0 les dates posteriors a DATA, inclosa ella mateixa. Exemple d'\u00FAs: dim=TIME_PERIOD:~after=2012-M02 \\n\\n- ~range=FECHA1;FECHA2 retornar\u00E0 les dates entre FECHA1 i FECHA2, totes dues incloses. Exemple d'\u00FAs: dim=TIME_PERIOD:~range=2012;2013
api.doc.swagger.paths.v1.0.datasets.agencyID.resourceID.version.get.parameters.fields.description         = Permet personalitzar la resposta mitjan\u00E7ant l'exclusi\u00F3 o inclusi\u00F3 de camps d'aquesta. Els possibles valors s\u00F3n '-metadata', '-data', '+keywords', '+dimension.description' i '+constraints'.\\nEjemplos: \\n\\n- fields=-metadata\\n\\n- fields=-metadata,-data \\n\\n- fields=-data,+dimension.description\\n- fields=+keywords\\n- fields=+constraints (limitacions de datasets)
api.doc.swagger.paths.v1.0.datasets.agencyID.resourceID.version.get.parameters.granularity.description    = Permet filtrar les observacions mitjan\u00E7ant les granularitats d'aquestes. <br> Exemple: granularity=GEOGRAPHIC_DIMENSION_ID[MUNICIPALITIES|PROVINCES],TIME_PERIOD[MONTHLY].
api.doc.swagger.paths.v1.0.datasets.agencyID.resourceID.version.get.parameters.isTransposed.description   = Posarem el valor a true en cas que es vulgui descarregar el *TSV transposat
api.doc.swagger.paths.v1.0.datasets.agencyID.resourceID.version.get.parameters.lang.description           = Idiomes en els quals es desitja obtenir la resposta. Als idiomes especificats sempre se li inclour\u00E0 l'idioma per defecte de l'organitzaci\u00F3. A m\u00E9s, en cas de no especificar-se cap idioma, la resposta es retornar\u00E0 en tots els idiomes disponibles. \\nExemples: \\n\\n- lang=es,en,ca\\n\\n- lang=pt
api.doc.swagger.paths.v1.0.datasets.agencyID.resourceID.version.get.parameters.representation.description = Permet filtrar les dades que s'obtenen en la resposta. Per a aix\u00F2, bastar\u00E0 amb especificar les dimensions que es volen filtrar i els valors a obtenir per a cadascuna d'elles. De les dimensions que no s'especifiqui cap filtre s'obtindran tots els valors existents. De manera addicional, les dimensions temporals permeten l'\u00FAs dels modificadors ~last, ~after i ~range. \\nExemples: \\n\\n- representation=TIME_PERIOD[2009|2010]\\n\\n- representation=TIME_PERIOD[2009|2010]:INDICADORS[INDEXI_OCUPACION_PLACES] \\n\\n- ~last=n retornar\u00E0 els \u00FAltims n valoris de la dimensi\u00F3 temporal. Exemple d'\u00FAs: representation=TIME_PERIOD[~last=2] \\n\\n- ~after=DATA retornar\u00E0 les dates posteriors a DATA, inclosa ella mateixa. Exemple d'\u00FAs: representation=TIME_PERIOD[~after=2012-M02] \\n\\n- ~range=FECHA1;FECHA2 retornar\u00E0 les dates entre FECHA1 i FECHA2, totes dues incloses. Exemple d'\u00FAs: representation=TIME_PERIOD[~range=2012;2013]
