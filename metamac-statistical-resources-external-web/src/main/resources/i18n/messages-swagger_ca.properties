api.doc.swagger.paths.v1.0.queries.agencyID.resourceID.get.parameters.fields.description                  = Permet personalitzar la resposta mitjan\u00E7ant l'exclusi\u00F3 o inclusi\u00F3 de camps d'aquesta. Els possibles valors s\u00F3n: '-metadata', '-data' i '+keywords'.\\nExemples: \\n\\n- fields=-metadata\\n\\n- fields=-metadata,-data\\n- fields=+keywords
api.doc.swagger.paths.v1.0.queries.agencyID.resourceID.get.parameters.lang.description                    = Idiomes en els quals es desitja obtenir la resposta. Als idiomes especificats sempre se li inclour\u00E0 l'idioma per defecte de l'organitzaci\u00F3. A m\u00E9s, en cas de no especificar-se cap idioma, la resposta es retornar\u00E0 en tots els idiomes disponibles. \\nExemples: \\n\\n- lang=es,en,ca\\n\\n- lang=pt
api.doc.swagger.paths.v1.0.queries.agencyID.resourceID.get.parameters.representation.description          = Permet filtrar les dades que s'obtenen en la resposta. Per a aix\u00F2, bastar\u00E0 amb especificar les dimensions que es volen filtrar i els valors a obtenir per a cadascuna d'elles. De les dimensions que no s'especifiqui cap filtre s'obtindran tots els valors existents. De manera addicional, les dimensions temporals permeten l'\u00FAs dels modificadors ~last, ~after i ~range. \\nExemples: \\n\\n- representation=TIME_PERIOD[2009|2010]\\n\\n- representation=TIME_PERIOD[2009|2010]:INDICADORS[INDEXI_OCUPACION_PLACES] \\n\\n- ~last=n retornar\u00E0 els \u00FAltims n valoris de la dimensi\u00F3 temporal. Exemple d'\u00FAs: representation=TIME_PERIOD[~last=2] \\n\\n- ~after=DATA retornar\u00E0 les dates posteriors a DATA, inclosa ella mateixa. Exemple d'\u00FAs: representation=TIME_PERIOD[~after=2012-M02] \\n\\n- ~range=FECHA1;FECHA2 retornar\u00E0 les dates entre FECHA1 i FECHA2, totes dues incloses. Exemple d'\u00FAs: representation=TIME_PERIOD[~range=2012;2013]
api.doc.swagger.paths.v1.0.queries.agencyID.resourceID.get.parameters.resourceID.description              = Identificador del recurs
api.doc.swagger.paths.v1.0.queries.agencyID.resourceID.get.responses.200.description                      = \u00C8xit. Indica que la petici\u00F3 ha estat resolta correctament
api.doc.swagger.paths.v1.0.queries.agencyID.resourceID.get.responses.404.description                      = No trobat. El recurs sol\u00B7licitat no existeix
api.doc.swagger.paths.v1.0.queries.agencyID.resourceID.get.responses.406.description                      = No acceptable. El format sol\u00B7licitat no \u00E9s v\u00E0lid
api.doc.swagger.paths.v1.0.queries.agencyID.resourceID.get.responses.500.description                      = Error intern del servidor. S'ha produ\u00EFt un error que impedeix que s'obtingui el recurs sol\u00B7licitat
api.doc.swagger.paths.v1.0.queries.agencyID.resourceID.get.responses.503.description                      = Servei no disponible. Indica que actualment el servidor no est\u00E0 disponible i, per tant, la sol\u00B7licitud no pot processar-se. L'error pot deure's a una sobrec\u00E0rrega temporal o a labors de manteniment del servidor. Es tracta d'una situaci\u00F3 temporal
api.doc.swagger.paths.v1.0.queries.agencyID.resourceID.version.get.parameters.granularity.description     = Permet filtrar les observacions mitjan\u00E7ant les granularitats d'aquestes. <br> Exemple: granularity=GEOGRAPHIC_DIMENSION_ID[MUNICIPALITIES|PROVINCES],TIME_PERIOD[MONTHLY].
api.doc.swagger.paths.v1.0.queries.get.description                                                        = Permet obtenir el llistat de totes les consultes estad\u00EDstiques existents
api.doc.swagger.paths.v1.0.queries.get.parameters.fields.description                                      = Permet personalitzar la resposta mitjan\u00E7ant l'exclusi\u00F3 o inclusi\u00F3 de camps d'aquesta. Els possibles valors s\u00F3n: '+statisticalOperation'.\\nExemple: \\n\\n- fields=+statisticalOperation\\n
api.doc.swagger.paths.v1.0.queries.get.parameters.lang.description                                        = Idiomes en els quals es desitja obtenir la resposta. Als idiomes especificats sempre se li inclour\u00E0 l'idioma per defecte de l'organitzaci\u00F3. A m\u00E9s, en cas de no especificar-se cap idioma, la resposta es retornar\u00E0 en tots els idiomes disponibles. \\nExemples: \\n\\n- lang=es,en,ca\\n\\n- lang=pt
