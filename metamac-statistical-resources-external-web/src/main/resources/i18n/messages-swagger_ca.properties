api.doc.swagger.paths.v1.0.collections.get.description= Permet obtenir el llistat de publicacions estadístiques
api.doc.swagger.paths.v1.0.collections.get.parameters.lang.description=Idiomes en els quals es desitja obtenir la resposta. Als idiomes especificats sempre se li inclourà l'idioma per defecte de l'organització. A més, en cas de no especificar-se cap idioma, la resposta es retornarà en tots els idiomes disponibles. \\nExemples: \\n\\n- lang=es,en,ca<br/>\r\n- lang=pt
api.doc.swagger.paths.v1.0.collections.get.parameters.limit.description=Nombre màxim de resultats a obtenir
api.doc.swagger.paths.v1.0.collections.get.parameters.offset.description=Desplaçament. Número a partir del qual es comencen a obtenir els resultats
api.doc.swagger.paths.v1.0.collections.get.parameters.fields.description=Permet personalitzar la resposta mitjançant l'exclusió o inclusió de camps d'aquesta. Els possibles valors són: '+statisticalOperation'.\\nExemple: \\n\\n- fields=+statisticalOperation\\n
api.doc.swagger.paths.v1.0.collections.get.responses.200.description=Èxit. Indica que la petició ha estat resolta correctament
api.doc.swagger.paths.v1.0.collections.get.responses.406.description=No acceptable. El format sol·licitat no és vàlid
api.doc.swagger.paths.v1.0.collections.get.responses.500.description=Error intern del servidor. S'ha produït un error que impedeix que s'obtingui el recurs sol·licitat
api.doc.swagger.paths.v1.0.collections.get.responses.503.description=Servei no disponible. Indica que actualment el servidor no està disponible i, per tant, la sol·licitud no pot processar-se. L'error pot deure's a una sobrecàrrega temporal o a labors de manteniment del servidor. Es tracta d'una situació temporal
