api.doc.swagger.paths.v1.0.datasets.agencyID.resourceID.version.get.parameters.representation.description=Permet filtrar les dades que s'obtenen en la resposta. Per a això, bastarà amb especificar les dimensions que es volen filtrar i els valors a obtenir per a cadascuna d'elles. De les dimensions que no s'especifiqui cap filtre s'obtindran tots els valors existents. De manera addicional, les dimensions temporals permeten l'ús dels modificadors ~last, ~after i ~range. \\nExemples: \\n\\n- representation=TIME_PERIOD[2009|2010]\\n\\n- representation=TIME_PERIOD[2009|2010]:INDICADORS[INDEXI_OCUPACION_PLACES] \\n\\n- ~last=n retornarà els últims n valoris de la dimensió temporal. Exemple d'ús: representation=TIME_PERIOD[~last=2] \\n\\n- ~after=DATA retornarà les dates posteriors a DATA, inclosa ella mateixa. Exemple d'ús: representation=TIME_PERIOD[~after=2012-M02] \\n\\n- ~range=FECHA1;FECHA2 retornarà les dates entre FECHA1 i FECHA2, totes dues incloses. Exemple d'ús: representation=TIME_PERIOD[~range=2012;2013]
