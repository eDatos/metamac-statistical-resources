api.doc.swagger.paths.v1.0.queries.agencyID.resourceID.get.parameters.representation.description=Permite filtrar los datos que se obtienen en la respuesta. Para ello, bastará con especificar las dimensiones que se quieren filtrar y los valores a obtener para cada una de ellas. De las dimensiones que no se especifique ningún filtro se obtendrán todos los valores existentes. De manera adicional, las dimensiones temporales permiten el uso de los modificadores ~last, ~after y ~range. \\nEjemplos: \\n\\n- representation=TIME_PERIOD[2009|2010]\\n\\n- representation=TIME_PERIOD[2009|2010]:INDICADORES[INDICE_OCUPACION_PLAZAS] \\n\\n- ~last=n devolverá los últimos n valores de la dimensión temporal. Ejemplo de uso: representation=TIME_PERIOD[~last=2] \\n\\n- ~after=FECHA devolverá las fechas posteriores a FECHA, incluida ella misma. Ejemplo de uso: representation=TIME_PERIOD[~after=2012-M02] \\n\\n- ~range=FECHA1;FECHA2 devolverá las fechas entre FECHA1 y FECHA2, ambas incluidas. Ejemplo de uso: representation=TIME_PERIOD[~range=2012;2013]
api.doc.swagger.paths.v1.0.queries.agencyID.resourceID.get.parameters.dim.description=<b>DEPRECADO use representations en su lugar.</b> Permite filtrar los datos que se obtienen en la respuesta. Para ello, bastará con especificar las dimensiones que se quieren filtrar y los valores a obtener para cada una de ellas. De las dimensiones que no se especifique ningún filtro se obtendrán todos los valores existentes. De manera adicional, las dimensiones temporales permiten el uso de los modificadores ~last, ~after y ~range. \\nEjemplos: \\n\\n- dim=TIME_PERIOD:2009|2010\\n\\n- dim=TIME_PERIOD:2009|2010:INDICADORES:INDICE_OCUPACION_PLAZAS \\n\\n- ~last=n devolverá los últimos n valores de la dimensión temporal. Ejemplo de uso: dim=TIME_PERIOD:~last=2 \\n\\n- ~after=FECHA devolverá las fechas posteriores a FECHA, incluida ella misma. Ejemplo de uso: dim=TIME_PERIOD:~after=2012-M02 \\n\\n- ~range=FECHA1;FECHA2 devolverá las fechas entre FECHA1 y FECHA2, ambas incluidas. Ejemplo de uso: dim=TIME_PERIOD:~range=2012;2013
api.doc.swagger.paths.v1.0.queries.agencyID.resourceID.get.parameters.fields.description=Permite personalizar la respuesta mediante la exclusión o inclusión de campos de la misma. Los posibles valores son '-metadata', '-data' y '+keywords'.\\nEjemplos: \\n\\n- fields=-metadata\\n\\n- fields=-metadata,-data\\n- fields=+keywords
