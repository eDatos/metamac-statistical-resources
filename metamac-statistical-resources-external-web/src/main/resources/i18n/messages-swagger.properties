api.doc.swagger.paths.v1.0.collections.get.description=Permite obtener el listado de publicaciones estad\u00edsticas
api.doc.swagger.paths.v1.0.collections.get.parameters.lang.description=Idiomas en los que se desea obtener la respuesta. A los idiomas especificados siempre se le incluir\u00e1 el idioma por defecto de la organizaci\u00f3n. Adem\u00e1s, en caso de no especificarse ning\u00fan idioma, la respuesta se devolver\u00e1 en todos los idiomas disponibles. \\nEjemplos: \\n\\n- lang=es,en,ca\\n\\n- lang=pt
api.doc.swagger.paths.v1.0.collections.get.parameters.limit.description=N\u00famero m\u00e1ximo de resultados a obtener
api.doc.swagger.paths.v1.0.collections.get.parameters.offset.description=Desplazamiento. N\u00famero a partir del cual se comienzan a obtener los resultados
api.doc.swagger.paths.v1.0.collections.get.parameters.fields.description=Permite personalizar la respuesta mediante la exclusi\u00f3n o inclusi\u00f3n de campos de la misma. Los posibles valores son '+statisticalOperation'.\\nEjemplos: \\n\\n- fields=+statisticalOperation\\n
api.doc.swagger.paths.v1.0.collections.get.parameters.query.description=Permite realizar una b\u00fasqueda sobre los resultados. \\n\\n Los metadatos sobre los que se puede buscar son: ID, NAME, DESCRIPTION, TITLE_ALTERNATIVE, KEYWORD, NEWNESS_UNTIL_DATE, VALID_FROM, VALID_TO y STATISTICAL_OPERATION_URN.\\n\\n Los operadores l\u00f3gicos que se permite usar son: AND y OR.  \\n\\n Los operadores de comparaci\u00f3n que se permite usar son: EQ, IEQ, LIKE, ILIKE, NE, LT, LE, GT, GE, IS_NULL, IS_NOT_NULL e IN
api.doc.swagger.paths.v1.0.collections.get.responses.200.description=\u00c9xito. Indica que la petici\u00f3n ha sido resuelta correctamente
api.doc.swagger.paths.v1.0.collections.get.responses.406.description=No aceptable. El formato solicitado no es v\u00e1lido
api.doc.swagger.paths.v1.0.collections.get.responses.500.description=Error interno del servidor. Se ha producido un error que impide que se obtenga el recurso solicitado
api.doc.swagger.paths.v1.0.collections.get.responses.503.description=Servicio no disponible. Indica que actualmente el servidor no est\u00e1 disponible y por tanto, la solicitud no puede procesarse. El error puede deberse a una sobrecarga temporal o a labores de mantenimiento del servidor. Se trata de una situaci\u00f3n temporal
api.doc.swagger.paths.v1.0.collections.agencyID.get.description=Permite obtener todas las publicaciones estad\u00edsticas mantenidas por una determinada organizaci\u00f3n
