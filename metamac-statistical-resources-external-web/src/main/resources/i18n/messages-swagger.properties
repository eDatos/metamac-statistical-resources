api.doc.swagger.paths.v1.0.queries.agencyID.resourceID.get.parameters.representation.description          = Permite filtrar los datos que se obtienen en la respuesta. Para ello, bastar\u00E1 con especificar las dimensiones que se quieren filtrar y los valores a obtener para cada una de ellas. De las dimensiones que no se especifique ning\u00FAn filtro se obtendr\u00E1n todos los valores existentes. De manera adicional, las dimensiones temporales permiten el uso de los modificadores ~last, ~after y ~range. \\nEjemplos: \\n\\n- representation=TIME_PERIOD[2009|2010]\\n\\n- representation=TIME_PERIOD[2009|2010]:INDICADORES[INDICE_OCUPACION_PLAZAS] \\n\\n- ~last=n devolver\u00E1 los \u00FAltimos n valores de la dimensi\u00F3n temporal. Ejemplo de uso: representation=TIME_PERIOD[~last=2] \\n\\n- ~after=FECHA devolver\u00E1 las fechas posteriores a FECHA, incluida ella misma. Ejemplo de uso: representation=TIME_PERIOD[~after=2012-M02] \\n\\n- ~range=FECHA1;FECHA2 devolver\u00E1 las fechas entre FECHA1 y FECHA2, ambas incluidas. Ejemplo de uso: representation=TIME_PERIOD[~range=2012;2013]
api.doc.swagger.paths.v1.0.queries.agencyID.resourceID.get.parameters.resourceID.description              = Identificador del recurso
api.doc.swagger.paths.v1.0.queries.agencyID.resourceID.get.responses.200.description                      = \u00C9xito. Indica que la petici\u00F3n ha sido resuelta correctamente
api.doc.swagger.paths.v1.0.queries.agencyID.resourceID.get.responses.304.description                      = El recurso no ha sido modificado desde la fecha indicada en la cabecera If-Modified-Since
api.doc.swagger.paths.v1.0.queries.agencyID.resourceID.get.responses.404.description                      = No encontrado. El recurso solicitado no existe
api.doc.swagger.paths.v1.0.queries.agencyID.resourceID.get.responses.406.description                      = No aceptable. El formato solicitado no es v\u00E1lido
api.doc.swagger.paths.v1.0.queries.agencyID.resourceID.get.responses.500.description                      = Error interno del servidor. Se ha producido un error que impide que se obtenga el recurso solicitado
api.doc.swagger.paths.v1.0.queries.agencyID.resourceID.get.responses.503.description                      = Servicio no disponible. Indica que actualmente el servidor no est\u00E1 disponible y por tanto, la solicitud no puede procesarse. El error puede deberse a una sobrecarga temporal o a labores de mantenimiento del servidor. Se trata de una situaci\u00F3n temporal
api.doc.swagger.paths.v1.0.queries.agencyID.resourceID.version.get.parameters.granularity.description     = Permite filtrar las observaciones mediante las granularidades de las mismas. <br> Ejemplo: granularity=GEOGRAPHIC_DIMENSION_ID[MUNICIPALITIES|PROVINCES],TIME_PERIOD[MONTHLY].
api.doc.swagger.paths.v1.0.queries.get.description                                                        = Permite obtener el listado de todas las consultas estad\u00EDsticas existentes
api.doc.swagger.paths.v1.0.queries.get.parameters.fields.description                                      = Permite personalizar la respuesta mediante la exclusi\u00F3n o inclusi\u00F3n de campos de la misma. Los posibles valores son '+statisticalOperation'.\\nEjemplos: \\n\\n- fields=+statisticalOperation\\n
api.doc.swagger.paths.v1.0.queries.get.parameters.lang.description                                        = Idiomas en los que se desea obtener la respuesta. A los idiomas especificados siempre se le incluir\u00E1 el idioma por defecto de la organizaci\u00F3n. Adem\u00E1s, en caso de no especificarse ning\u00FAn idioma, la respuesta se devolver\u00E1 en todos los idiomas disponibles. \\nEjemplos: \\n\\n- lang=es,en,ca\\n\\n- lang=pt
api.doc.swagger.paths.v1.0.queries.get.parameters.limit.description                                       = N\u00FAmero m\u00E1ximo de resultados a obtener
api.doc.swagger.paths.v1.0.queries.get.parameters.offset.description                                      = Desplazamiento. N\u00FAmero a partir del cual se comienzan a obtener los resultados
api.doc.swagger.paths.v1.0.queries.get.parameters.orderBy.description                                     = Permite ordenar la lista de resultados seg\u00FAn un determinado metadato. El orden se especifica mediante un metadato y el sentido del orden (operador) que se le quiere aplicar.\\n\\n Los posibles operadores son ASC y DESC.\\n\\n Los metadatos que se pueden usar son ID, NAME. \\nEjemplos:\\n\\n- ID ASC\\n\\n- ID DESC\\n\\n- NAME ASC\\n\\n- NAME DESC
api.doc.swagger.paths.v1.0.queries.get.parameters.query.description                                       = Permite realizar una b\u00FAsqueda sobre los resultados. \\n\\n Los metadatos sobre los que se puede buscar son: ID, NAME, DESCRIPTION, RELATED_DATASET_URN, TYPE, STATUS, VALID_FROM, VALID_TO y STATISTICAL_OPERATION_URN, NEWNESS_UNTIL_DATE, FEATURED_UNTIL_DATE.\\n\\n Los operadores l\u00F3gicos que se permite usar son: AND y OR.  \\n\\n Los operadores de comparaci\u00F3n que se permite usar son: EQ, IEQ, LIKE, ILIKE, NE, LT, LE, GT, GE, IS_NULL, IS_NOT_NULL e IN
api.doc.swagger.paths.v1.0.queries.get.responses.200.description                                          = \u00C9xito. Indica que la petici\u00F3n ha sido resuelta correctamente
api.doc.swagger.paths.v1.0.queries.get.responses.406.description                                          = No aceptable. El formato solicitado no es v\u00E1lido
api.doc.swagger.paths.v1.0.queries.get.responses.500.description                                          = Error interno del servidor. Se ha producido un error que impide que se obtenga el recurso solicitado
api.doc.swagger.paths.v1.0.queries.get.responses.503.description                                          = Servicio no disponible. Indica que actualmente el servidor no est\u00E1 disponible y por tanto, la solicitud no puede procesarse. El error puede deberse a una sobrecarga temporal o a labores de mantenimiento del servidor. Se trata de una situaci\u00F3n temporal
api.doc.swagger.paths.v1.0.resources.get.description                                                      = Permite obtener el listado de recursos cacheados por elemento de variable geogr\u00E1fica u operaci\u00F3n estad\u00EDstica. Se devuelve siempre la informaci\u00F3n de la \u00FAltima versi\u00F3n del recurso. Para cada recurso que cumple con los criterios, se devuelve tambi\u00E9n la informaci\u00F3n de el conjunto de recursos relacionados.
api.doc.swagger.paths.v1.0.resources.get.parameters.fields.description                                    = Permite personalizar la respuesta mediante la exclusi\u00F3n o inclusi\u00F3n de campos de la misma. \\n\\n  Los posibles valores son: \\n\\n- relatedResourcesWithoutSelectedCriteria \\n\\n- operationTitle \\n\\n Con 'relatedResourcesWithoutSelectedCriteria' se devolver\u00E1n  s\u00F3lo los recursos relacionados que cumplen con los criterios establecidos en 'query' para el recurso principal. Con 'operationTitle', se obtiene la descripci\u00F3n de la operaci\u00F3n estad\u00EDstica asociada a cada recurso. \\n\\n Ejemplos: \\n\\n fields=-relatedResourcesWithoutSelectedCriteria,+operationTitle\\n
api.doc.swagger.paths.v1.0.resources.get.parameters.lang.description                                      = Idiomas en los que se desea obtener la respuesta. A los idiomas especificados siempre se le incluir\u00E1 el idioma por defecto de la organizaci\u00F3n. Adem\u00E1s, en caso de no especificarse ning\u00FAn idioma, la respuesta se devolver\u00E1 en todos los idiomas disponibles. \\nEjemplos: \\n\\n- lang=es,en,ca\\n\\n- lang=pt
api.doc.swagger.paths.v1.0.resources.get.parameters.limit.description                                     = N\u00FAmero m\u00E1ximo de resultados a obtener
api.doc.swagger.paths.v1.0.resources.get.parameters.offset.description                                    = Desplazamiento. N\u00FAmero a partir del cual se comienzan a obtener los resultados
api.doc.swagger.paths.v1.0.resources.get.parameters.orderBy.description                                   = Permite ordenar la lista de resultados seg\u00FAn un determinado metadato. El orden se especifica mediante un metadato y el sentido del orden (operador) que se le quiere aplicar.\\n\\n Los posibles operadores son ASC y DESC.\\n\\n Los metadatos que se pueden usar son ID, NAME. \\nEjemplos:\\n\\n- ID ASC\\n\\n- ID DESC
api.doc.swagger.paths.v1.0.resources.get.parameters.query.description                                     = Permite realizar una b\u00FAsqueda sobre los resultados. \\n\\n Los metadatos sobre los que se puede buscar son: ID (dataset code), GEOCOV_VARELEM_ID, STATISTICAL_OPERATION_URN.\\n\\n Los operadores l\u00F3gicos que se permite usar son: AND y OR.  \\n\\n Los operadores de comparaci\u00F3n que se permite usar son: EQ, IEQ, LIKE, ILIKE, NE, LT, LE, GT, GE, IS_NULL, IS_NOT_NULL e IN
api.doc.swagger.paths.v1.0.resources.get.responses.200.description                                        = \u00C9xito. Indica que la petici\u00F3n ha sido resuelta correctamente
api.doc.swagger.paths.v1.0.resources.get.responses.406.description                                        = No aceptable. El formato solicitado no es v\u00E1lido
