api.doc.swagger.paths.v1.0.datasets.agencyID.resourceID.version.get.parameters.fields.description=Permite personalizar la respuesta mediante la exclusi\u00f3n o inclusi\u00f3n de campos de la misma. Los posibles valores son '-metadata', '-data',  '+keywords', '+dimension.description' y '+constraints'.\\nEjemplos: \\n\\n- fields=-metadata\\n\\n- fields=-metadata,-data \\n\\n- fields=-data,+dimension.description\\n- fields=+keywords\\n- fields=+constraints (limitaciones de datasets)
