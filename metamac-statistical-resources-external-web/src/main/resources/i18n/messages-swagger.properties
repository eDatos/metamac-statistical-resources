api.doc.swagger.paths.v1.0.collections.get.parameters.orderBy.description=Permite ordenar la lista de resultados según un determinado metadato. El orden se especifica mediante un metadato y el sentido del orden (operador) que se le quiere aplicar.\\n\\n Los posibles operadores son ASC y DESC.\\n\\n El metadato que se puede usar es ID. \\nEjemplos:\\n\\n- ID ASC\\n\\n- ID DESC
