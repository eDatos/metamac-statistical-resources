api.doc.swagger.paths.v1.0.resources.get.responses.503.description                                        = Servicio no disponible. Indica que actualmente el servidor no est\u00E1 disponible y por tanto, la solicitud no puede procesarse. El error puede deberse a una sobrecarga temporal o a labores de mantenimiento del servidor. Se trata de una situaci\u00F3n temporal
api.doc.swagger.paths.v1.0.headers.ifModifiedSince.description                                            = Si se incluye esta cabecera, el servidor devolver\u00E1 un 304 Not Modified (sin cuerpo) si el recurso no ha sido modificado desde la fecha indicada. Formato RFC 1123
api.doc.swagger.paths.v1.0.headers.cacheControl.description                                               = Directiva de cach\u00E9 que indica al cliente que debe revalidar la respuesta con el servidor antes de usar la versi\u00F3n en cach\u00E9. Valor: no-cache, public
